# /etc/nginx/sites-available/reports — troque reports.sidim.com.br pelo domínio real.
# O certificado vem do certbot (sudo certbot --nginx -d reports.sidim.com.br), como no SINC.
server {
    listen 80;
    server_name reports.sidim.com.br;

    # Fotos chegam comprimidas (~500 KB); as ações aceitam até 4 MB por envio (next.config.ts).
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # O limite de tentativas de login usa este cabeçalho (src/lib/limite-login.ts). Sem ele, todo mundo
        # conta como o mesmo IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A emissão gera o PDF e envia os e-mails antes de responder.
        proxy_read_timeout 120s;
    }
}
